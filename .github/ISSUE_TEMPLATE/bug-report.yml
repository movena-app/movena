name: Bug report
description: Report a reproducible Movena problem without private provider data.
title: '[Bug]: '
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, playlist/stream URLs, provider responses, viewing history, or copyrighted media.
  - type: input
    id: version
    attributes:
      label: Movena version
      placeholder: 0.1.9
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted examples only.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual behavior }
    validations: { required: true }
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostic report
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private URLs, provider data, viewing history, and copyrighted media.
          required: true
