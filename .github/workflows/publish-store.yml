name: Publish Microsoft Store Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag whose MSIX should be submitted
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: store-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish-store:
    name: Publish existing release to Microsoft Store
    runs-on: windows-latest
    steps:
      - name: Validate Microsoft Store credentials
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: |
          $required = @{
            STORE_TENANT_ID = $env:STORE_TENANT_ID
            STORE_SELLER_ID = $env:STORE_SELLER_ID
            STORE_CLIENT_ID = $env:STORE_CLIENT_ID
            STORE_CLIENT_SECRET = $env:STORE_CLIENT_SECRET
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object { $_.Key })
          if ($missing.Count -gt 0) { throw "Missing Microsoft Store credentials: $($missing -join ', ')." }
      - name: Download release MSIX
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag '$env:RELEASE_TAG'." }
          New-Item -ItemType Directory -Path "windows-artifacts" -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern "*.msix" --dir "windows-artifacts"
          if ($LASTEXITCODE -ne 0) { throw "Could not download the MSIX from release $env:RELEASE_TAG." }
          $msixFiles = @(Get-ChildItem -Path "windows-artifacts" -Filter "*.msix" -File)
          if ($msixFiles.Count -ne 1) { throw "Expected exactly one release MSIX, found $($msixFiles.Count)." }
      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4
        with:
          version: v0.3.9
      - name: Submit release MSIX
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          STORE_PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID || '9P2T0QGGHQGQ' }}
        run: |
          $reconfigArgs = @('reconfigure', '--tenantId', $env:STORE_TENANT_ID, '--sellerId', $env:STORE_SELLER_ID, '--clientId', $env:STORE_CLIENT_ID, '--clientSecret', $env:STORE_CLIENT_SECRET)
          & msstore @reconfigArgs
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store CLI configuration failed." }
          $msixFiles = @(Get-ChildItem -Path "windows-artifacts" -Filter "*.msix" -File)
          if ($msixFiles.Count -ne 1) { throw "Expected exactly one release MSIX, found $($msixFiles.Count)." }
          & msstore publish $msixFiles[0].FullName --appId $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store submission failed." }
