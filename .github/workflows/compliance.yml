name: Verify

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Pull requests and pushes only fail on advisories they add, so main itself
    # is checked daily to catch new ones before a release does.
    - cron: '30 5 * * *'
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libmpv-dev
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build

  ui-quality:
    name: UI component quality
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - name: Run accessibility, geometry, locale, and visual component QA
        run: npm run test:ui:visual
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-qa-windows
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  packaged-desktop:
    name: Packaged desktop journey
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - name: Restore pinned Windows playback runtime
        # shinchiro prunes its releases after about a month. The cached copy,
        # verified against the pinned checksum when first fetched, keeps CI
        # building once the pinned build is gone upstream.
        uses: actions/cache@v6
        with:
          path: |
            src-tauri/lib/mpv-dev
            src-tauri/lib/yt-dlp
            src-tauri/lib/libmpv-2.dll
            src-tauri/lib/libmpv.dll.a
            src-tauri/lib/mpv.dll.a
            src-tauri/lib/mpv.lib
            src-tauri/lib/libmpv.lib
            src-tauri/lib/libmpv-2.lib
          key: windows-playback-runtime-${{ hashFiles('scripts/ensure-windows-mpv.mjs') }}
      - name: Provision pinned native playback runtime
        run: npm run setup:mpv
      - name: Build feature-gated desktop test binary
        run: npm run test:desktop:build
      - name: Stage native playback runtime beside desktop test binary
        shell: pwsh
        run: |
          $source = Resolve-Path 'src-tauri/lib/mpv-dev/libmpv-2.dll'
          $destination = 'src-tauri/target/debug/libmpv-2.dll'
          Copy-Item -LiteralPath $source -Destination $destination -Force
          if (-not (Test-Path -LiteralPath $destination)) {
            throw 'libmpv-2.dll was not staged beside the desktop E2E executable.'
          }
          if ((Get-FileHash -LiteralPath $source).Hash -ne (Get-FileHash -LiteralPath $destination).Hash) {
            throw 'The staged desktop E2E libmpv runtime does not match the pinned source.'
          }
      - name: Exercise onboarding through the real Tauri boundary
        run: npm run test:desktop
      - name: Upload desktop E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-windows
          path: |
            logs/
            errorShots/
          if-no-files-found: ignore

  source-and-dependencies:
    name: Windows native and source compliance
    if: github.event_name != 'schedule'
    # The committed license report includes platform-specific optional packages.
    # Generate and verify it on the project's Windows development target.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - name: Restore pinned Windows playback runtime
        # shinchiro prunes its releases after about a month. The cached copy,
        # verified against the pinned checksum when first fetched, keeps CI
        # building once the pinned build is gone upstream.
        uses: actions/cache@v6
        with:
          path: |
            src-tauri/lib/mpv-dev
            src-tauri/lib/yt-dlp
            src-tauri/lib/libmpv-2.dll
            src-tauri/lib/libmpv.dll.a
            src-tauri/lib/mpv.dll.a
            src-tauri/lib/mpv.lib
            src-tauri/lib/libmpv.lib
            src-tauri/lib/libmpv-2.lib
          key: windows-playback-runtime-${{ hashFiles('scripts/ensure-windows-mpv.mjs') }}
      - run: npm run setup:mpv
      - run: npm run setup:twitch
      - name: Run native tests on Windows
        shell: pwsh
        run: |
          $env:PATH = "$(Resolve-Path 'src-tauri/lib/mpv-dev');$env:PATH"
          npm run test:rust
      - run: npm run check:licenses
      - run: npm run check:public-tree
      - name: Reject private media in Git history
        shell: bash
        run: |
          if git log --all --name-only --pretty=format: | grep -E '\.(m3u8?|xspf|xmltv|mp4|mkv|avi|mov|m4v|mp3|flac)$' | grep -Ev '^tests/fixtures/'; then
            echo 'Private playlists or bundled media remain in Git history.' >&2
            exit 1
          fi

  macos-native:
    name: macOS native tests
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install mpv
      - run: npm ci --ignore-scripts
      - run: npm run test:rust

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20
      - run: cargo deny --manifest-path src-tauri/Cargo.toml check bans licenses sources
      - name: Check Rust and runtime npm advisories
        # Advisory databases change without a commit. Pull requests and pushes
        # to main fail only on advisories missing from their base; releases,
        # manual runs and the schedule fail on any advisory.
        env:
          ADVISORY_BASE: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha
            || github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before
            || '' }}
        run: npm run check:advisories
