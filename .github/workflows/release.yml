name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release revision
    uses: ./.github/workflows/compliance.yml

  build-source:
    name: Build source archives
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Confirm project versions match
        shell: bash
        run: |
          package_version="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('package.json', 'utf8')).version)")"
          cargo_version="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log((readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version\s*=\s*\"([^\"]+)\"/m) ?? [])[1] ?? '')")"
          test "$package_version" = "$cargo_version"
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$package_version"
          fi
      - name: Create source archives
        shell: bash
        run: |
          package_version="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('package.json', 'utf8')).version)")"
          tag="v${package_version}"
          mkdir -p dist-source
          git archive --format=tar.gz --prefix="movena-${tag}/" --output="dist-source/movena-${tag}-source.tar.gz" HEAD
          git archive --format=zip --prefix="movena-${tag}/" --output="dist-source/movena-${tag}-source.zip" HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: source-artifacts
          path: dist-source/*

  build-windows:
    name: Build Windows installers & portable
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Setup Windows mpv binaries
        run: npm run setup:mpv
      - name: Build pinned Twitch resolver
        run: npm run setup:twitch
      - name: Validate Windows signing configuration
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw 'WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD must either both be configured or both be absent.'
          }
      - name: Import Authenticode certificate
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/prepare-windows-signing.ps1 -CertificateBase64 $env:WINDOWS_CERTIFICATE -CertificatePassword $env:WINDOWS_CERTIFICATE_PASSWORD
      - name: Build Tauri bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $arguments = @('tauri', 'build', '--config', 'src-tauri/tauri.bundle.windows.conf.json')
          if ($env:WINDOWS_SIGNING_CONFIG) { $arguments += @('--config', $env:WINDOWS_SIGNING_CONFIG) }
          & npx @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Authenticode signatures
        if: env.WINDOWS_CERTIFICATE_THUMBPRINT != ''
        shell: pwsh
        run: |
          $artifacts = @(
            Get-Item 'src-tauri/target/release/movena.exe' -ErrorAction Stop
            Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File -ErrorAction SilentlyContinue
            Get-ChildItem 'src-tauri/target/release/bundle/msi' -Filter '*.msi' -File -ErrorAction SilentlyContinue
          )
          if ($artifacts.Count -eq 0) { throw 'No Windows artifacts were produced.' }
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($artifact.FullName) ($($signature.Status))" }
          }
      - name: Package Windows artifacts
        shell: pwsh
        run: |
          $version = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path "windows-artifacts" -Force | Out-Null

          # NSIS Installer
          if (Test-Path "src-tauri/target/release/bundle/nsis") {
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | ForEach-Object {
              Copy-Item $_.FullName "windows-artifacts/$($_.Name)"
            }
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.sig" | ForEach-Object {
              Copy-Item $_.FullName "windows-artifacts/$($_.Name)"
            }
          }

          # MSI Installer
          if (Test-Path "src-tauri/target/release/bundle/msi") {
            Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" | ForEach-Object {
              Copy-Item $_.FullName "windows-artifacts/$($_.Name)"
            }
            Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.sig" | ForEach-Object {
              Copy-Item $_.FullName "windows-artifacts/$($_.Name)"
            }
          }

          # Portable Zip
          $portableDir = "portable-windows"
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item "src-tauri/target/release/movena.exe" "$portableDir/Movena.exe"
          Copy-Item "src-tauri/lib/mpv-dev/libmpv-2.dll" "$portableDir/libmpv-2.dll"
          Copy-Item "src-tauri/lib/yt-dlp/yt-dlp.exe" "$portableDir/yt-dlp.exe"
          Copy-Item "src-tauri/lib/twitch-resolver" "$portableDir/twitch-resolver" -Recurse
          Copy-Item "LICENSE" "$portableDir/LICENSE"
          Copy-Item "THIRD_PARTY_LICENSES.txt" "$portableDir/THIRD_PARTY_LICENSES.txt"
          $resolver = "$portableDir/twitch-resolver/twitch-resolver.exe"
          if (-not (Test-Path $resolver)) { throw "Portable Twitch resolver is missing" }
          if (-not (Test-Path "$portableDir/twitch-resolver/THIRD_PARTY_NOTICES.txt")) { throw "Twitch resolver notices are missing" }
          if ((& $resolver --version).Trim() -ne "8.5.0") { throw "Unexpected bundled Streamlink version" }
          & $resolver --can-handle-url "https://www.twitch.tv/gleggmire"
          if ($LASTEXITCODE -ne 0) { throw "Bundled Streamlink cannot handle Twitch channels" }
          Compress-Archive -Path "$portableDir/*" -DestinationPath "windows-artifacts/Movena-v${version}-windows-x64-portable.zip"
          # Build MSIX Package
          & ./scripts/make-msix.ps1 -SkipBuild -OutputDirectory "windows-artifacts"
          $resolverBytes = (Get-ChildItem "src-tauri/lib/twitch-resolver" -File -Recurse | Measure-Object Length -Sum).Sum
          Write-Host "Bundled Twitch resolver: $([math]::Round($resolverBytes / 1MB, 1)) MiB"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: windows-artifacts/*

  build-macos:
    name: Build macOS DMG & app (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon; macos-15-intel is GitHub's hosted
          # x86_64 replacement for the retired macos-13 image. Each builds
          # natively for its own architecture — no cross-compilation, no
          # Rosetta — so every existing step below (mpv via Homebrew,
          # PyInstaller for the Twitch resolver, cargo/tauri build) runs
          # completely unchanged on both.
          - os: macos-latest
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install mpv and dylibbundler
        run: brew install mpv dylibbundler
      - name: Generate macOS runtime license notices
        # Walks Homebrew's own installed libmpv (independent of anything our
        # build produces) to record every library scripts/bundle-macos-mpv.mjs
        # is about to embed into the app, before the app itself even exists —
        # tauri.bundle.macos.conf.json embeds this file as a build resource.
        run: node scripts/generate-macos-runtime-licenses.mjs
      - run: npm ci
      - name: Build pinned Twitch resolver
        run: npm run setup:twitch
      - name: Validate and configure Apple signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signing_values=(
            "$APPLE_CERTIFICATE"
            "$APPLE_CERTIFICATE_PASSWORD"
            "$APPLE_SIGNING_IDENTITY"
            "$APPLE_ID"
            "$APPLE_PASSWORD"
            "$APPLE_TEAM_ID"
          )
          configured=0
          for value in "${signing_values[@]}"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -ne 0 ] && [ "$configured" -ne "${#signing_values[@]}" ]; then
            echo 'Apple signing and notarization secrets must either all be configured or all be absent.' >&2
            exit 1
          fi
          if [ "$configured" -eq "${#signing_values[@]}" ]; then
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi
      - name: Build Tauri bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config src-tauri/tauri.bundle.macos.conf.json
      - name: Verify bundled Twitch resolver and mpv runtime
        shell: bash
        run: |
          app="src-tauri/target/release/bundle/macos/Movena.app"
          resolver="$app/Contents/Resources/twitch-resolver/twitch-resolver"
          test -x "$resolver"
          test -f "$(dirname "$resolver")/THIRD_PARTY_NOTICES.txt"
          test "$($resolver --version)" = "8.5.0"
          "$resolver" --can-handle-url https://www.twitch.tv/gleggmire
          test -f "$app/Contents/Resources/THIRD_PARTY_NOTICES_MACOS_RUNTIME.txt"
          # scripts/bundle-macos-mpv.mjs already asserted this on the raw
          # executable before Tauri packaged and signed it — re-checking the
          # actually-shipped binary here catches anything the bundling step
          # itself could not: packaging re-introducing an absolute reference.
          test -n "$(find "$app/Contents/Resources/Frameworks" -maxdepth 1 -name '*.dylib' -print -quit)"
          if otool -L "$app/Contents/MacOS/movena" | grep -E '/(usr/local|opt/homebrew)/'; then
            echo 'Homebrew-absolute library paths leaked into the packaged app.' >&2
            exit 1
          fi
          codesign --verify --deep --strict "$app"
      - name: Verify Developer ID, notarization, and stapling
        if: env.APPLE_SIGNING_IDENTITY != ''
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/Movena.app
          codesign -dv --verbose=4 src-tauri/target/release/bundle/macos/Movena.app 2>&1 | grep -F "Authority=Developer ID Application"
          spctl --assess --type execute --verbose=4 src-tauri/target/release/bundle/macos/Movena.app
          xcrun stapler validate src-tauri/target/release/bundle/macos/Movena.app
      - name: Package macOS artifacts
        shell: bash
        run: |
          mkdir -p macos-artifacts
          if [ -d "src-tauri/target/release/bundle/dmg" ]; then
            cp src-tauri/target/release/bundle/dmg/*.dmg macos-artifacts/ 2>/dev/null || true
          fi
          # Tauri already builds and signs the .app.tar.gz updater bundle itself
          # (with bundle.createUpdaterArtifacts on) — reuse that file instead of
          # re-tarring the .app, which would produce different bytes than what
          # got signed and break updater signature verification.
          #
          # Unlike the DMG (which Tauri already names with its target arch,
          # e.g. Movena_0.1.16_aarch64.dmg), this updater bundle is always
          # named the same regardless of arch — harmless as a single build,
          # but the aarch64 and x86_64 matrix legs would silently clobber
          # each other once both land in the same release. Renamed here so
          # both survive; generate-latest-json.mjs expects these exact names.
          app_tar="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' -print -quit 2>/dev/null || true)"
          if [ -n "$app_tar" ]; then
            cp "$app_tar" "macos-artifacts/Movena_${{ matrix.arch }}.app.tar.gz"
            cp "${app_tar}.sig" "macos-artifacts/Movena_${{ matrix.arch }}.app.tar.gz.sig"
          fi
          du -sh src-tauri/lib/twitch-resolver
      - uses: actions/upload-artifact@v7
        with:
          # Suffixed per matrix leg (still matching the publish job's
          # `*-artifacts` download pattern) — a shared "macos-artifacts" name
          # across both legs would have the second upload silently replace
          # the first instead of the two coexisting.
          name: macos-${{ matrix.arch }}-artifacts
          path: macos-artifacts/*

  build-linux:
    name: Build Linux packages
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libmpv-dev \
            patchelf
      - run: npm ci
      - name: Build pinned Twitch resolver
        run: npm run setup:twitch
      - name: Build Tauri bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config src-tauri/tauri.bundle.linux.conf.json
      - name: Verify bundled Twitch resolver
        shell: bash
        run: |
          resolver="$(find src-tauri/target/release/bundle -type f -name twitch-resolver -print -quit)"
          test -n "$resolver"
          test -x "$resolver"
          test -f "$(dirname "$resolver")/THIRD_PARTY_NOTICES.txt"
          test "$($resolver --version)" = "8.5.0"
          "$resolver" --can-handle-url https://www.twitch.tv/gleggmire
      - name: Package Linux artifacts
        shell: bash
        run: |
          mkdir -p linux-artifacts
          if [ -d "src-tauri/target/release/bundle/deb" ]; then
            cp src-tauri/target/release/bundle/deb/*.deb linux-artifacts/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/deb/*.sig linux-artifacts/ 2>/dev/null || true
          fi
          if [ -d "src-tauri/target/release/bundle/appimage" ]; then
            cp src-tauri/target/release/bundle/appimage/*.AppImage linux-artifacts/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/appimage/*.sig linux-artifacts/ 2>/dev/null || true
          fi
          du -sh src-tauri/lib/twitch-resolver
      - uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: linux-artifacts/*

  publish:
    name: Publish Release with All Artifacts
    needs: [build-source, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-artifacts'
          path: release-downloads
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Collect all assets
        shell: bash
        run: |
          mkdir -p release-final
          find release-downloads -type f -exec cp {} release-final/ \;
      - name: Generate updater manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/generate-latest-json.mjs release-final
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: release-final/movena.spdx.json
          upload-artifact: false
      - name: Checksum all assets
        shell: bash
        run: |
          cd release-final
          sha256sum * > SHA256SUMS.txt
      - name: Attest release provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-final/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_DEBUG: api
        shell: bash
        run: |
          package_version="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('package.json', 'utf8')).version)")"
          tag="v${package_version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-final/* --clobber
          else
            gh release create "$tag" release-final/* \
              --target "$GITHUB_SHA" \
              --title "Movena $tag" \
              --generate-notes
          fi

  publish-store:
    name: Publish to Microsoft Store
    needs: [build-windows, publish]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-artifacts
          path: windows-artifacts
      - name: Validate Microsoft Store credentials
        id: check-store-credentials
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: |
          $configured = (-not [string]::IsNullOrWhiteSpace($env:STORE_TENANT_ID)) -and `
                        (-not [string]::IsNullOrWhiteSpace($env:STORE_SELLER_ID)) -and `
                        (-not [string]::IsNullOrWhiteSpace($env:STORE_CLIENT_ID)) -and `
                        (-not [string]::IsNullOrWhiteSpace($env:STORE_CLIENT_SECRET))
          if ($configured) {
            "has_credentials=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "has_credentials=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
      - name: Setup Microsoft Store Developer CLI
        if: steps.check-store-credentials.outputs.has_credentials == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.4
        with:
          version: v0.3.9
      - name: Submit to Microsoft Store
        if: steps.check-store-credentials.outputs.has_credentials == 'true'
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          STORE_PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID || '9P2T0QGGHQGQ' }}
        run: |
          $reconfigArgs = @('reconfigure', '--tenantId', $env:STORE_TENANT_ID, '--sellerId', $env:STORE_SELLER_ID, '--clientId', $env:STORE_CLIENT_ID, '--clientSecret', $env:STORE_CLIENT_SECRET)
          & msstore @reconfigArgs
          $msixFiles = @(Get-ChildItem -Path "windows-artifacts" -Filter "*.msix" -File)
          if ($msixFiles.Count -ne 1) { throw "Expected exactly one MSIX artifact, found $($msixFiles.Count)." }
          & msstore publish $msixFiles[0].FullName --appId $env:STORE_PRODUCT_ID
