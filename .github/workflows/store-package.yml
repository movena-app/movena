name: Build Microsoft Store package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional version override (for example 0.1.8)
        required: false
        type: string
      identity_name:
        description: Partner Center MSIX identity name
        required: false
        type: string
      publisher:
        description: Partner Center publisher, for example CN=...
        required: false
        type: string
      publish_to_store:
        description: Automatically upload to Microsoft Store via Submission API
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: store-package
  cancel-in-progress: true

jobs:
  msix:
    name: Build and package MSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Build MSIX
        shell: pwsh
        run: |
          $params = @{
            OutputDirectory = (Join-Path $PWD 'store-artifacts')
          }
          if ('${{ inputs.version }}') { $params.Version = '${{ inputs.version }}' }
          if ('${{ inputs.identity_name }}') { $params.IdentityName = '${{ inputs.identity_name }}' }
          if ('${{ inputs.publisher }}') { $params.Publisher = '${{ inputs.publisher }}' }
          ./scripts/make-msix.ps1 @params
      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: movena-msix
          path: store-artifacts/*.msix
          if-no-files-found: error
      - name: Validate Microsoft Store credentials
        id: check-store-credentials
        if: inputs.publish_to_store
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: |
          $configured = (-not [string]::IsNullOrWhiteSpace($env:STORE_TENANT_ID)) -and `
                        (-not [string]::IsNullOrWhiteSpace($env:STORE_CLIENT_ID)) -and `
                        (-not [string]::IsNullOrWhiteSpace($env:STORE_CLIENT_SECRET))
          if ($configured) {
            "has_credentials=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "has_credentials=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
      - name: Setup Microsoft Store Developer CLI
        if: inputs.publish_to_store && steps.check-store-credentials.outputs.has_credentials == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1
      - name: Publish to Microsoft Store
        if: inputs.publish_to_store && steps.check-store-credentials.outputs.has_credentials == 'true'
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          STORE_PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID || '9P2T0QGGHQGQ' }}
        run: |
          $reconfigArgs = @('reconfigure', '--tenantId', $env:STORE_TENANT_ID, '--clientId', $env:STORE_CLIENT_ID, '--clientSecret', $env:STORE_CLIENT_SECRET)
          if ($env:STORE_SELLER_ID) { $reconfigArgs += @('--sellerId', $env:STORE_SELLER_ID) }
          & msstore @reconfigArgs
          $msix = (Get-ChildItem -Path "store-artifacts" -Filter "*.msix" | Select-Object -First 1).FullName
          & msstore publish $msix -id $env:STORE_PRODUCT_ID


