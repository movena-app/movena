[graph]
all-features = true

[advisories]
yanked = "deny"
# Unmaintained transitive crates with no replacement we can switch to. Every
# other advisory fails the check.
ignore = [
  # proc-macro-error, pulled by glib-macros 0.18 in Tauri's Linux GTK3 stack.
  "RUSTSEC-2024-0370",
  # zvariant, zvariant_derive and zbus_names are unmaintained since they were
  # merged into zbus 6. tauri-plugin-opener 2.7.2 and keyring's Linux Secret
  # Service store still require zbus 5. Drop these once both move to zbus 6.
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0371",
  "RUSTSEC-2026-0372",
]

[licenses]
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "LGPL-2.1-only",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

[licenses.private]
ignore = true

[[licenses.exceptions]]
allow = ["LGPL-2.1"]
crate = "libmpv-sys@3.1.0"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
